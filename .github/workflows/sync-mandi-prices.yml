name: Daily AgriBridge mandi price sync

on:
  schedule:
    - cron: "30 2 * * *" # 08:00 IST every day
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Import latest AGMARKNET mandi prices
        env:
          SUPABASE_URL: ${{ secrets.AGRIBRIDGE_SUPABASE_URL }}
          SYNC_TOKEN: ${{ secrets.MARKET_PRICE_SYNC_TOKEN }}
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing AGRIBRIDGE_SUPABASE_URL repository secret" && exit 1)
          test -n "$SYNC_TOKEN" || (echo "Missing MARKET_PRICE_SYNC_TOKEN repository secret" && exit 1)
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 30 --max-time 900 \
            -X POST "$SUPABASE_URL/functions/v1/sync-mandi-prices" \
            -H "x-sync-token: $SYNC_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}' | tee sync-result.json
          grep -q '"success": true' sync-result.json || (echo "Mandi sync did not report success" && exit 1)
